<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peshawar Division Polio Monitor</title>
<meta name="description" content="Online dashboard for Peshawar Division, all districts: polio campaign coverage and intra-campaign monitoring (ICM) findings for Peshawar Division, Khyber Pakhtunkhwa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F3F2F7; --surface:#FFFFFF; --surface-2:#F8F7FB; --sunk:#EEECF4;
  --ink:#191426; --ink-2:#4B4560; --muted:#77718A; --line:#E3E0EC; --line-2:#CFCADC;
  --accent:#6A3DBD; --accent-ink:#FFFFFF; --accent-soft:#EEE7FB; --accent-2:#8B63D6;
  --rail:#17112B; --rail-2:#231B3D; --rail-ink:#D9D2EE; --rail-muted:#8E86AB; --rail-hi:#C4A8FF;
  --pass:#1F8A5B; --watch:#C98A0B; --fail:#C7392F; --grey:#9993AA;
  --pass-soft:#E2F2E9; --watch-soft:#FBF0D6; --fail-soft:#FBE5E2;
  --b1:#F3D67E; --b2:#EBA650; --b3:#D96B3B; --b4:#AE2E29;
  --h0:#EEE7FA; --h1:#D2BFF1; --h2:#AC8BE0; --h3:#8157C6; --h4:#4F2A92;
  --nodata:#DDD9E6; --outside:#EBE9F1; --outline:#FFFFFF; --edge:#2A2240;
  --shadow:0 1px 2px rgba(25,20,38,.05),0 10px 28px -16px rgba(25,20,38,.22);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#110E19; --surface:#1A1624; --surface-2:#1F1B2B; --sunk:#15121E;
  --ink:#EEEAF6; --ink-2:#C0B9D2; --muted:#8C85A0; --line:#2B263A; --line-2:#3A344B;
  --accent:#B294F4; --accent-ink:#170F2C; --accent-soft:#2A2143; --accent-2:#9C7BE8;
  --rail:#0C0915; --rail-2:#1A1430; --rail-ink:#D9D2EE; --rail-muted:#7F779C; --rail-hi:#C4A8FF;
  --pass:#2FA873; --watch:#D39A22; --fail:#E4574B; --grey:#6E6883;
  --pass-soft:#14301F; --watch-soft:#33280E; --fail-soft:#3A1916;
  --b1:#8A7430; --b2:#B77B2E; --b3:#D8683A; --b4:#F0685A;
  --h0:#2E2544; --h1:#48376D; --h2:#6D52A0; --h3:#9677D0; --h4:#CDB7F5;
  --nodata:#332E42; --outside:#1F1B29; --outline:#1A1624; --edge:#E9E2F8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#110E19; --surface:#1A1624; --surface-2:#1F1B2B; --sunk:#15121E;
  --ink:#EEEAF6; --ink-2:#C0B9D2; --muted:#8C85A0; --line:#2B263A; --line-2:#3A344B;
  --accent:#B294F4; --accent-ink:#170F2C; --accent-soft:#2A2143; --accent-2:#9C7BE8;
  --rail:#0C0915; --rail-2:#1A1430; --rail-ink:#D9D2EE; --rail-muted:#7F779C; --rail-hi:#C4A8FF;
  --pass:#2FA873; --watch:#D39A22; --fail:#E4574B; --grey:#6E6883;
  --pass-soft:#14301F; --watch-soft:#33280E; --fail-soft:#3A1916;
  --b1:#8A7430; --b2:#B77B2E; --b3:#D8683A; --b4:#F0685A;
  --h0:#2E2544; --h1:#48376D; --h2:#6D52A0; --h3:#9677D0; --h4:#CDB7F5;
  --nodata:#332E42; --outside:#1F1B29; --outline:#1A1624; --edge:#E9E2F8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,td,.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ shell ============ */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 20px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:750;font-size:17px;letter-spacing:-.01em;color:#fff;line-height:1.1}
.brand small{display:block;color:var(--rail-muted);font-size:11.5px;margin-top:2px}
.nav-g{margin:6px 0 14px}
.nav-h{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:6px 10px 6px;display:flex;align-items:center;gap:8px}
.nav-h i{width:7px;height:7px;border-radius:2px;background:var(--rail-hi);display:inline-block}
.nav-h i.icm{background:#7FD1B9}.nav-h i.x{background:#F3C969}
.nav a{display:flex;align-items:center;gap:10px;color:var(--rail-ink);text-decoration:none;padding:8px 10px;border-radius:9px;font-weight:500;font-size:13.5px}
.nav a svg{width:17px;height:17px;flex:none;opacity:.75}
.nav a:hover{background:var(--rail-2)}
.nav a[aria-current="page"]{background:var(--rail-2);color:#fff;font-weight:650}
.nav a[aria-current="page"] svg{opacity:1;color:var(--rail-hi)}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--rail-muted);display:flex;flex-direction:column;gap:6px}
.rail-foot b{color:var(--rail-ink);font-weight:600}
.menu-btn{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.ctx{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ctx-in{padding:14px clamp(16px,2.4vw,32px) 12px;display:flex;flex-direction:column;gap:10px}
.sitebar{display:flex;align-items:baseline;gap:10px 14px;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid var(--line)}
.sitebar .sname{font-family:var(--display);font-weight:800;font-size:15.5px;letter-spacing:-.01em;color:var(--ink)}
.sitebar .ssub{font-size:12px;color:var(--muted)}
.ctx-top{display:flex;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;justify-content:space-between}
.ptitle h1{font-family:var(--display);font-weight:750;font-size:clamp(21px,2.1vw,27px);letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
.ptitle p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .lt{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-left:6px;opacity:.7}
.frow{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;flex:0 1 170px}
.fld label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select,.inp{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 28px 7px 10px;font-size:12.5px;font-weight:500;width:100%;min-width:0;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 54%,calc(100% - 9px) 54%;background-size:5px 5px;background-repeat:no-repeat}
.inp{background-image:none;padding-right:10px}
select.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background-color:var(--accent-soft)}
select:disabled{opacity:.55}
.ms{position:relative}
.msb{appearance:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 28px 7px 10px;font:inherit;font-size:12.5px;font-weight:500;width:100%;min-width:0;text-align:left;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 54%,calc(100% - 9px) 54%;background-size:5px 5px;background-repeat:no-repeat}
.msb.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background-color:var(--accent-soft)}
.msb:disabled{opacity:.55;cursor:default}
.msp{position:absolute;top:calc(100% + 4px);left:0;z-index:40;width:max(100%,270px);max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px}
.msp[hidden]{display:none}
.ms-act{display:flex;gap:12px;align-items:center}.ms-act .linkbtn{padding:2px 0}.ms-n{margin-left:auto}
.ms-list{max-height:min(340px,55vh);overflow:auto;display:flex;flex-direction:column;margin:0 -4px}
.ms-h{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 6px 3px}
.fld .ms-i{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);display:flex;gap:8px;align-items:center;padding:6px;border-radius:6px;font-size:13px;cursor:pointer}.ms-i:hover{background:var(--accent-soft)}
.ms-i input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.ms-i[hidden],.ms-g[hidden]{display:none}
.ms-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px}
.ms-ok{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:12.5px;padding:7px 16px;cursor:pointer}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:7px 2px}

.page{padding:18px clamp(16px,2.4vw,32px) 48px;display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.015em;margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:12.5px}

/* ============ cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card.lift{box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.card-h h3{font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12px}
.card-b{padding:0 16px 16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.g-side{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:1280px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

/* KPI band */
.kband{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.k{padding:13px 16px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.k:last-child{border-right:0}
.k .kn{font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.25}
.k .kv{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.k .ks{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dl{font-weight:700}.dl.good{color:var(--pass)}.dl.bad{color:var(--fail)}.dl.flat{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px 2px 5px;border-radius:999px;white-space:nowrap;line-height:1.4}
.pill svg{width:10px;height:10px}
.pill.pass{background:var(--pass-soft);color:var(--pass)}.pill.watch{background:var(--watch-soft);color:var(--watch)}.pill.fail{background:var(--fail-soft);color:var(--fail)}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.gauge{padding:10px 14px 14px;text-align:center;min-width:0}
.gauge+.gauge{border-left:1px solid var(--line)}
.gauge>svg{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.gauge .gl{font-size:12.5px;font-weight:650;color:var(--ink-2);margin-top:2px}

/* tables */
.tw{overflow:auto;max-width:100%}
.tw.tall{max-height:520px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;vertical-align:bottom;white-space:normal;min-width:64px;line-height:1.25}
th.l,td.l{text-align:left}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}th.on{color:var(--accent)}
tbody td.l:first-child,thead th.l:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
thead th.l:first-child{z-index:3}
td.l b{font-weight:650}
td .sub{display:block;font-size:11px;color:var(--muted);font-weight:500}
tbody tr.click{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr.cur td{background:var(--accent-soft)!important}
tr.tot td{font-weight:700;background:var(--sunk)!important;border-top:1px solid var(--line-2)}
td.c-pass{color:var(--pass);font-weight:700}td.c-watch{color:var(--watch);font-weight:700}td.c-fail{color:var(--fail);font-weight:700}
td.bgc-pass{background:var(--pass-soft)}td.bgc-watch{background:var(--watch-soft)}td.bgc-fail{background:var(--fail-soft)}
td .bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:8px;background:var(--h2)}
.rk{color:var(--muted);font-size:11px;font-weight:700;width:26px}
.empty{padding:22px 16px;color:var(--muted);font-size:13px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--ink-2)}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted);font-size:11px}
.chart .vl{fill:var(--ink);font-weight:700;font-size:11.5px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink-2);stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--ink-2);align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* maps */
.mgrid{display:grid;gap:14px}
.mgrid.n9{grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.mgrid.n1{grid-template-columns:minmax(0,1fr)}
@media (max-width:1180px){.mgrid.n9,.mgrid.n6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.mgrid.n9,.mgrid.n6,.mgrid.n4{grid-template-columns:minmax(0,1fr)}}
.mp{display:flex;flex-direction:column}
.mp-h{display:flex;gap:8px;align-items:center;padding:10px 12px 4px;flex-wrap:wrap}
.mp-h h3{font-family:var(--display);font-weight:700;font-size:14.5px;margin:0;flex:1 1 auto;min-width:0}
.mp-h select{width:auto;flex:0 1 auto;max-width:100%;font-size:12px;padding:5px 26px 5px 8px}
.mp-h .ind-sel{flex:1 1 150px;font-weight:650;font-size:13px}
.ibtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink-2)}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn svg{width:15px;height:15px}
.mp-sum{padding:0 12px;font-size:11.5px;color:var(--muted);min-height:16px}
.msvg{display:block;width:100%;height:auto}
.card.maxed{position:fixed;inset:0;z-index:75;margin:0;border-radius:0;overflow:auto;background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.card.maxed .msvg{height:calc(100dvh - 140px);width:100%}
body.has-max{overflow:hidden}
.msvg .u{stroke:var(--outline);stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer}
.msvg .u.o{cursor:pointer;opacity:.9}
.msvg .u:hover{stroke:var(--ink);stroke-width:1.6}
.msvg .u.sel{stroke:var(--ink);stroke-width:2.6}
.msvg .t{fill:none;stroke:var(--edge);stroke-opacity:.28;stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.msvg .d{fill:none;stroke:var(--edge);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.msvg text{pointer-events:none;font-family:var(--body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
.msvg text.dn{font-family:var(--display);font-weight:800;letter-spacing:.1em;fill:var(--ink-2)}
.mp .legend{padding:6px 12px 12px}
.mwrap{position:relative;padding:0 6px}
.zoomctl{position:absolute;right:12px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}

/* spot */
.spt circle{stroke:var(--surface);stroke-width:.6;vector-effect:non-scaling-stroke}
.spt .u{fill:var(--sunk);stroke:var(--line-2);stroke-width:.6;vector-effect:non-scaling-stroke}
.spt .u.in{fill:var(--surface-2)}
.spt .u.fo{fill:var(--accent-soft);stroke:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,7,18,.55);display:flex;align-items:center;justify-content:center;padding:clamp(8px,3vw,40px)}
.modal[hidden]{display:none}
.modal .card{width:min(1200px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.modal .msvg{max-height:calc(100dvh - 190px)}

/* tooltip */
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;min-width:190px;max-width:300px;opacity:0;transition:opacity .08s}
.tip.show{opacity:1}
.tip h4{margin:0;font-family:var(--display);font-size:15px;font-weight:700}
.tip .w{color:var(--muted);font-size:11.5px;margin:1px 0 8px}
.tip dl{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin:0}
.tip dt{color:var(--ink-2)}.tip dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* race */

.note{font-size:12px;color:var(--muted)}

.err b{color:var(--fail)}
.foot{padding:4px 0 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
details.defs summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.defs-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px;margin-top:8px}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}

.seg button+button{border-left:1px solid var(--line-2)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}

}
/* ============ branding bar ============ */
.sitebar{align-items:center!important;flex-wrap:nowrap!important}
.sitebar .lg{height:44px;width:auto;background:#fff;border-radius:9px;padding:3px 5px;border:1px solid var(--line);flex:none}
.sitebar .lg-who{height:40px;padding:5px 8px}
.sb-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.sb-r{display:flex;align-items:center;gap:10px;flex:none}
.pbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:650;color:var(--ink-2);cursor:pointer}
.pbtn svg{width:15px;height:15px}.pbtn:hover{border-color:var(--accent);color:var(--ink)}
.rf-site{color:var(--rail-ink);line-height:1.4;padding:8px 10px;margin:0 -4px;border-radius:9px;background:linear-gradient(135deg,rgba(196,168,255,.16),rgba(127,209,185,.12))}

@media (max-width:760px){.ctx{position:static}.sitebar .sname{font-size:14px;line-height:1.2}.sitebar .ssub{display:none}.pbtn span{display:none}.sitebar .lg{height:34px}.sitebar .lg-who{height:30px}}

/* ============ hero ============ */
.hero{position:relative;overflow:hidden;border-radius:18px;color:#fff;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:250px;
  background:linear-gradient(115deg,rgba(23,17,43,.92) 0%,rgba(58,31,110,.86) 52%,rgba(106,61,189,.70) 100%),linear-gradient(115deg,#17112B,#3A1F6E 55%,#6A3DBD);box-shadow:var(--shadow)}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:float 14s ease-in-out infinite alternate}
.o1{width:280px;height:280px;background:#7FD1B9;left:-80px;bottom:-140px}
.o2{width:220px;height:220px;background:#F0709A;right:20%;top:-120px;animation-duration:17s}
.o3{width:180px;height:180px;background:#C4A8FF;right:-40px;bottom:-60px;animation-duration:12s}
@keyframes float{to{transform:translate(40px,-24px) scale(1.12)}}
.hero-txt{position:relative;padding:24px 26px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hero-eb .live{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:#7FD1B9;box-shadow:0 0 0 0 rgba(127,209,185,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(127,209,185,0)}100%{box-shadow:0 0 0 0 rgba(127,209,185,0)}}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.4vw,32px);letter-spacing:-.02em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:13px;max-width:56ch}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:10px}
.hs{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
.hs b{display:block;font-family:var(--display);font-weight:780;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.hs span{font-size:11.5px;color:rgba(255,255,255,.75)}
.hero-art{position:relative;min-height:220px}
.hmap{position:absolute;inset:14px 18px 44px 0;width:calc(100% - 18px);height:calc(100% - 58px)}
.hmap .hd{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.85);stroke-width:1.4;stroke-dasharray:2400;stroke-dashoffset:0;animation:draw 2.4s ease-out both}
.hmap .hd.off{stroke:rgba(255,255,255,.35);fill:rgba(255,255,255,.02)}
@keyframes draw{from{stroke-dashoffset:2400;fill:rgba(255,255,255,0)}}
.hdot{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.hdot.off{opacity:.45}
.hdot text{fill:#fff;font-family:var(--body);font-weight:650;paint-order:stroke;stroke:rgba(23,17,43,.75);stroke-width:.6px;stroke-linejoin:round}
.hdot .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite;opacity:.55}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.dropper{position:absolute;right:16px;top:8px;width:54px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px) rotate(-3deg)}}
.drop{animation:fall 2.4s ease-in infinite;opacity:0}
.drop.d2{animation-delay:1.2s}
@keyframes fall{0%{transform:translateY(-6px) scale(.5);opacity:0}15%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(46px) scale(.8);opacity:0}}
.ticker{grid-column:1/-1;position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.14);background:rgba(10,7,22,.35);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk-in{display:flex;width:max-content;animation:scroll var(--dur,40s) linear infinite}
.ticker:hover .tk-in{animation-play-state:paused}
.tk-g{display:flex}
.tk{display:inline-flex;align-items:center;gap:8px;padding:9px 22px 9px 0;font-size:12.5px;white-space:nowrap;color:rgba(255,255,255,.86)}
.tk b{color:#fff}.tk i{width:8px;height:8px;border-radius:50%;flex:none}
@keyframes scroll{to{transform:translateX(-50%)}}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.hero-art{min-height:190px;order:-1}.hmap{inset:8px 70px 8px 8px;width:calc(100% - 78px);height:calc(100% - 16px)}}

/* ============ gauges, donuts, bars, rings ============ */
.gauges.gx{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.gauges.gx .gauge+.gauge{border-left:0}
.gauges.gx .gauge{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gauge .gp{margin-top:5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.garc{stroke-dasharray:100;stroke-dashoffset:0;animation:sweep 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes sweep{from{stroke-dashoffset:100}}
.needle{transform-box:view-box;transform-origin:120px 104px;animation:needle 1.3s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes needle{from{transform:rotate(-90deg)}to{transform:rotate(var(--a))}}
.dwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:160px;height:160px;flex:none}
.dseg{animation:dseg 1.1s cubic-bezier(.3,.7,.2,1) both}
@keyframes dseg{from{stroke-dasharray:0 400}}
.dn-v{font-family:var(--display);font-weight:780;font-size:20px;fill:var(--ink)}
.dn-l{font-size:10.5px;fill:var(--muted);font-family:var(--body)}
.dleg{display:flex;flex-direction:column;gap:6px;flex:1 1 170px;min-width:0}
.dl-r{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;gap:8px;align-items:center;font-size:12px}
.dl-r i{width:10px;height:10px;border-radius:3px}.dl-r span{color:var(--ink-2);line-height:1.25}.dl-r b{font-variant-numeric:tabular-nums}.dl-r em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;border-radius:8px;padding:2px 4px;margin:0 -4px}
.hb.click{cursor:pointer}.hb.click:hover{background:var(--accent-soft)}
.hb-l{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-l small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.hb-t{position:relative;height:12px;border-radius:6px;background:var(--sunk)}
.hb-t i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
.hb-t b{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink-2);opacity:.6}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes growX{from{transform:scaleX(0)}}
.chart path.bar{transform-box:fill-box;transform-origin:50% 100%;animation:growY .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(0)}}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sc{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rise .5s ease both}
.sc.click{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}.sc.click:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.ring{width:74px;height:74px;flex:none}.ring text{font-family:var(--display);font-weight:760;font-size:14px;fill:var(--ink)}
.rseg{animation:dseg 1.2s cubic-bezier(.3,.7,.2,1) both}
.sc-b{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px;color:var(--muted)}
.sc-b b{font-family:var(--display);font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-b em{font-style:normal;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.page.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.page.enter>*:nth-child(2){animation-delay:.05s}.page.enter>*:nth-child(3){animation-delay:.1s}.page.enter>*:nth-child(4){animation-delay:.15s}.page.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ============ downloads ============ */
.card.has-dl{position:relative}.card.has-dl>.dlb{position:absolute;top:10px;right:10px;z-index:3}

.ltip dl{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin:0}.ltip dt{color:var(--ink-2)}.ltip dd{margin:0;text-align:right;font-weight:600}
.stackn span{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#17112B;color:#fff;font:700 11px/1 var(--body);border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}

}

<script>
"use strict";
/* =====================================================================
   PESHAWAR DIVISION POLIO MONITOR
   Reads three files written by the "Export for Web" buttons:
     data/coverage.csv   UC x campaign x day rows from DATA&MASTER
     data/icm.csv        one row per ICM cluster (no names, GPS ~100 m)

/* ---------------- GPS check, same rule as the ICM Cluster Spot sheet ----------------
   inside its own UC (or a neighbouring UC of the same tehsil, or within 1.5 km of its edge) = right place
   up to 5 km outside = borderline · beyond 5 km = wrong place

function pip(lon,lat,rings){ let ins=false; for(const r of rings){ for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j]; if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)) ins=!ins; } } return ins; }

function analyseSpots(){
  const byUC=new Map(); for(const r of D.icm) if(r.lat){ const k=r.district+"|"+r.uc; (byUC.get(k)||byUC.set(k,[]).get(k)).push(r); }
  const med=a=>{const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2;};
  const centre=new Map(); for(const [k,a] of byUC) if(a.length>=5) centre.set(k,[med(a.map(r=>r.lat)),med(a.map(r=>r.lon))]);
  for(const r of D.icm){
    if(!r.lat){ r.band=-1; continue; }
    const u=D.ucByKey.get(r.district+"|"+r.uc);
    if(u){
      if(inUC(u,r.lon,r.lat)){ r.band=0; r.kmOut=0; continue; }
      let best=1e9; for(const ring of u.rings) for(const [lo,la] of ring){ const d=km(r.lat,r.lon,la,lo); if(d<best) best=d; }

function panZoom(svg,host){

  ctl.innerHTML=`<button class="ibtn" aria-label="Zoom in"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="ibtn" aria-label="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="ibtn" aria-label="Reset view"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 3v2.5h2.5"/></svg></button>`;
  const [bi,bo,br]=$$("button",ctl); bi.onclick=()=>zoomAt(1/1.4,vb[0]+vb[2]/2,vb[1]+vb[3]/2); bo.onclick=()=>zoomAt(1.4,vb[0]+vb[2]/2,vb[1]+vb[3]/2); br.onclick=()=>{vb=[...base];set();};

    const onKey=e=>{ if(e.key==="Escape") exit(); };
    const onFs=()=>{ if(!document.fullscreenElement) exit(); };
    fb.onclick=()=>{ if(card.classList.contains("maxed")) return exit();
      card.classList.add("maxed"); document.body.classList.add("has-max"); fb.innerHTML=X_ICON; fb.setAttribute("aria-label","Close full screen"); document.addEventListener("keydown",onKey);
      const p=document.documentElement.requestFullscreen?.(); if(p&&p.then) p.then(()=>document.addEventListener("fullscreenchange",onFs)).catch(()=>{}); };
  }
}

   BAR CHART RACE (Race sheet)
   ===================================================================== */
const DCOL={CHARSADA:["#2a78d6","#3987e5"],KHYBER:["#1baf7a","#199e70"],MOHMAND:["#eb6834","#d95926"],NOWSHERA:["#4a3aa7","#9085e9"],PESHAWAR:["#e87ba4","#d55181"]};
const isDark=()=>matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.dataset.theme!=="light"||document.documentElement.dataset.theme==="dark";
let raceTimer=null;
function pgCovRace(el){
  const mk=S.race.m, ind=IND[mk], camps=D.covCamps;
  const frames=camps.map(c=>{ const a=covAgg(covRows({camp:c}),ucKey); return {c,vals:new Map([...a].map(([k,m])=>[k,m[mk]]))}; });
  el.innerHTML=`<div class="card lift"><div class="card-h"><div><h3>${esc(ind.t)} — the 15 highest union councils, round by round</h3><p>${esc(scopeName())} · bars are coloured by district</p></div>
    <div class="race-ctl"><div class="seg">${[["stillNA","Still NA"],["stillRef","Still refusals"],["still","Still missed"]].map(([k,l])=>`<button data-m="${k}" aria-pressed="${k===mk}">${l}</button>`).join("")}</div><button class="btn pri" id="play">Play rounds</button></div></div>
    <div class="card-b"><div class="race-round" id="rr">${esc(camps.at(-1))}</div><div class="chart race" id="race"></div><div class="legend" style="margin-top:8px">${Object.keys(DCOL).map(d=>`<span class="lg"><span class="sw" style="background:${DCOL[d][isDark()?1:0]}"></span>${tc(d)}</span>`).join("")}</div></div></div>
    <div class="card"><div class="card-h"><div><h3>${esc(ind.t)} by round</h3><p>${esc(scopeName())}</p></div></div><div class="card-b chart" id="rt"></div></div>`;
  const tot=covAgg(covRows({camp:""}),r=>r.camp); barsSVG($("#rt"),camps.map(c=>({label:c,v:tot.get(c)?.[mk],hl:true})),ind,{all:1});
  const host=$("#race"), W=Math.max(320,host.clientWidth), rowH=26, top=15, H=top*rowH+24, ml=Math.min(190,W*.34), mr=60;
  const draw=(fa,fb,t)=>{ const keys=new Set([...fa.vals.keys(),...fb.vals.keys()]); const cur=[...keys].map(k=>{const a=fa.vals.get(k)||0,b=fb.vals.get(k)||0; return {k,v:a+(b-a)*t,ra:0,rb:0};});
    const rank=m=>{ const arr=[...m].filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]); return new Map(arr.map(([k],i)=>[k,i])); };
    const Ra=rank(fa.vals), Rb=rank(fb.vals); for(const o of cur){ const a=Ra.get(o.k)??top+2, b=Rb.get(o.k)??top+2; o.r=a+(b-a)*t; }
    const vis=cur.filter(o=>o.r<top+.5&&o.v>0); const mx=Math.max(1,...vis.map(o=>o.v)); const x=v=>ml+(W-ml-mr)*v/mx;
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart race">`;
    for(const o of vis){ const y=12+o.r*rowH, [d,u]=o.k.split("|"), col=DCOL[d]?DCOL[d][isDark()?1:0]:"var(--h3)", op=Math.max(0,Math.min(1,top+.5-o.r));
      s+=`<g opacity="${op}"><text x="${ml-8}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle" style="font-size:12px;font-weight:600;fill:var(--ink)">${esc(tc(u))}</text><rect x="${ml}" y="${y+3}" width="${Math.max(2,x(o.v)-ml)}" height="${rowH-6}" rx="4" fill="${col}"/><text x="${x(o.v)+6}" y="${y+rowH/2}" dominant-baseline="middle" style="font-size:12px;font-weight:700;fill:var(--ink)" class="tnum">${nf.format(Math.round(o.v))}</text></g>`; }
    host.innerHTML=s+"</svg>"; };
  const n=frames.length; draw(frames[n-1],frames[n-1],1);
  $$("[data-m]",el).forEach(b=>b.onclick=()=>{S.race.m=b.dataset.m;render();});
  $("#play").onclick=()=>{ cancelAnimationFrame(raceTimer); let i=0,t0=null; const dur=1600;
    const step=ts=>{ if(t0==null) t0=ts; const t=Math.min(1,(ts-t0)/dur); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; draw(frames[i],frames[Math.min(n-1,i+1)],n===1?1:e); $("#rr").textContent=frames[t<.5?i:Math.min(n-1,i+1)].c;
      if(t>=1){ i++; t0=null; if(i>=n-1) return; setTimeout(()=>raceTimer=requestAnimationFrame(step),500); return; } raceTimer=requestAnimationFrame(step); };
    draw(frames[0],frames[0],1); $("#rr").textContent=frames[0].c; if(n>1) setTimeout(()=>raceTimer=requestAnimationFrame(step),600); };
}

/* semicircle gauge that understands every band type; needle + arc animate in */
function gauge2(v,ind,label,o={}){
  const max=o.max??1, W=240,H=150,cx=120,cy=104,R=84,sw=15;
  const ang=x=>Math.PI*(1-clamp01(x/max)), pt=(x,r)=>[cx+r*Math.cos(ang(x)),cy-r*Math.sin(ang(x))];
  const arcD=(x0,x1,r=R)=>{ const [a0,b0]=pt(x0,r),[a1,b1]=pt(x1,r); return `M${a0.toFixed(2)} ${b0.toFixed(2)}A${r} ${r} 0 0 1 ${a1.toFixed(2)} ${b1.toFixed(2)}`; };
  const b=bandOf(ind,v), cuts=[...new Set([0,...(ind.band||[]).filter(x=>x!=null&&x>0&&x<max),max])].sort((a,c)=>a-c);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: ${fmt(v,ind)}">`;
  for(let i=0;i<cuts.length-1;i++){ const mid=(cuts[i]+cuts[i+1])/2, z=bandOf(ind,mid)||"grey"; s+=`<path d="${arcD(cuts[i],cuts[i+1])}" stroke="var(--${z})" stroke-width="${sw}" fill="none" opacity=".2"/>`; }
  for(const t of cuts.slice(1,-1).concat(max>1&&!cuts.some(c=>Math.abs(c-1)<.08)?[1]:[])){ const [tx,ty]=pt(t,R+sw/2+11); s+=`<text x="${tx.toFixed(1)}" y="${(ty+3).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--body)">${+(t*100).toFixed(1)}%</text>`; }
  if(v!=null&&isFinite(v)){
    s+=`<path class="garc" pathLength="100" d="${arcD(0,Math.min(Math.max(v,0),max)||.0001)}" stroke="var(--${b||"accent"})" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
    const deg=-90+180*clamp01(v/max);
    s+=`<g class="needle" style="--a:${deg.toFixed(1)}deg" transform="rotate(${deg.toFixed(1)} ${cx} ${cy})"><path d="M${cx-4} ${cy}L${cx} ${cy-R+24}L${cx+4} ${cy}Z" fill="var(--ink)"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/><circle cx="${cx}" cy="${cy}" r="3" fill="var(--surface)"/></g>`;
  }
  s+=`<text class="cu" x="${cx}" y="${cy+38}" text-anchor="middle" font-family="var(--display)" font-weight="760" font-size="26" letter-spacing="-.5" fill="var(--${b||"ink"})">${fmt(v,ind)}</text></svg>`;
  return `<div class="gauge">${s}<div class="gl">${esc(label)}</div><div class="gp">${pill(b)}${ind.band?`<span class="note">target ${esc(bandText(ind).pass)}</span>`:""}</div></div>`;
}
function donutHTML(parts,o={}){
  const P2=parts.map(p=>({...p,v:Math.max(0,p.v||0)})), tot=P2.reduce((a,p)=>a+p.v,0), R=62,C=2*Math.PI*R; let off=0;
  let s=`<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="${esc(o.label||"")}"><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="22"/>`;
  P2.forEach((p,i)=>{ const len=tot?p.v/tot*C:0; if(len>.2) s+=`<circle class="dseg" cx="80" cy="80" r="${R}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)" style="animation-delay:${(i*.12).toFixed(2)}s"><title>${esc(p.l)}: ${nf.format(Math.round(p.v))}</title></circle>`; off+=len; });
  s+=`<text class="cu dn-v" x="80" y="80" text-anchor="middle">${nf.format(Math.round(tot))}</text><text class="dn-l" x="80" y="99" text-anchor="middle">${esc(o.center||"total")}</text></svg>`;
  return `<div class="dwrap">${s}<div class="dleg">${P2.map(p=>`<div class="dl-r"><i style="background:${p.c}"></i><span>${esc(p.l)}</span><b>${nf.format(Math.round(p.v))}</b><em>${tot?(p.v/tot*100).toFixed(1)+"%":"–"}</em></div>`).join("")}</div></div>`;
}
/* horizontal bars (HTML) — rows: {k,label,v,txt,sub} */
function hbarsHTML(rows,ind,o={}){

/* ---------------- count-up animation ---------------- */
function countUp(root){
  if(RM.matches) return;
  const items=[];
  for(const e of $$(".kv, .cu",root)){ if(e.dataset.cu||e.children.length) continue; e.dataset.cu="1";
    const m=/^([^\d−-]*)(-?[\d,]*\.?\d+)(.*)$/.exec(e.textContent); if(!m) continue; const num=+m[2].replace(/,/g,""); if(!isFinite(num)||num===0) continue;
    items.push({e,pre:m[1],suf:m[3],num,dec:(m[2].split(".")[1]||"").length,comma:m[2].includes(",")}); }
  if(!items.length) return; const t0=performance.now(), dur=1200;
  const step=now=>{ const p=Math.min(1,(now-t0)/dur), k=1-Math.pow(1-p,3);
    for(const it of items){ if(!it.e.isConnected) continue; const v=it.num*k; it.e.textContent=it.pre+(it.comma?v.toLocaleString("en-US",{minimumFractionDigits:it.dec,maximumFractionDigits:it.dec}):v.toFixed(it.dec))+it.suf; }
    if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function inlineSVG(svg,doc,win){

async function satSpot(host,pts,mode,scopeU){

    b.onclick=()=>set(!card.classList.contains("maxed")); document.addEventListener("keydown",function k(e){ if(!b.isConnected){ document.removeEventListener("keydown",k); return; } if(e.key==="Escape"&&card.classList.contains("maxed")) set(false); }); return b; }});

  const m=r.v, chk=m.a1+m.a2, vac=m.a1c+m.a2c; if(mode==="missed") return m.nt>0?"var(--fail)":(m.tv>0?"var(--watch)":"var(--pass)");
  const p=chk?vac/chk:null; return p==null?"var(--grey)":p>=.9?"var(--pass)":p>=.8?"var(--watch)":"var(--fail)"; }
const SPOT_MODES={gps:{t:"GPS check",leg:SPOT_BAND.map(b=>[b.c,b.t,b.d])},

function spotSVG(pts,vb,mode,o={}){
  const g=S.geo; const r=Math.max(vb[2],vb[3])/(o.small?260:380);
  let s=`<svg class="msvg spt" viewBox="${vb.join(" ")}" role="img" aria-label="Cluster positions">`;
  for(const u of D.U){ const b=u.bb; if(b[2]<vb[0]||b[0]>vb[0]+vb[2]||b[3]<vb[1]||b[1]>vb[1]+vb[3]) continue; const ins=(!g.district||u.district===g.district)&&(!g.tehsils.length||g.tehsils.includes(u.tehsil));
    s+=`<use href="#gu${u.i}" class="u${ins?" in":""}${isPicked(u)?" fo":""}" data-k="${esc(u.key)}"/>`; }
  for(const d of D.Di) s+=`<use href="#gd${d.i}" class="d"/>`;

function pgIcmTables(el){
  const t=S.icmTable, rer=()=>pgIcmTables(el);
  el.innerHTML=`<div class="chips">${ICM_TABLES.map(([k,l])=>`<button class="chip" data-t="${k}" aria-pressed="${k===t}">${l}</button>`).join("")}</div><div id="tb"></div>`;
  $$("[data-t]",el).forEach(b=>b.onclick=()=>{S.icmTable=b.dataset.t;render();});
  const tb=$("#tb"), card=(h,p,body)=>`<div class="card"><div class="card-h"><div><h3>${h}</h3><p>${p}</p></div></div><div class="tw tall" id="tt">${body}</div></div>`;
  const ucc={k:"_k",t:"Union council",l:1,fn:r=>ucLabel(r._k),sv:r=>r._k.split("|")[1]};
  if(t==="ucsum"){ const U=[...icmAgg(icmRows(),ucKey)].map(([k,m])=>({_k:k,...m})); if(!S.sort.ius) S.sort.ius={k:"recallPct",d:1};
    tb.innerHTML=card("UC summary",`${esc(S.icm.camp)} · ${U.length} union councils`,tableHTML([ucc,{k:"clusters"},{k:"hh"},{k:"children"},{k:"vaccinated"},{k:"recallPct",bg:1},{k:"seenPct",bg:1},{k:"missed"},{k:"nt"},{k:"tv"},{k:"na"},{k:"ref"},{k:"guestPct"},{k:"ri"},{k:"vm"},{k:"ff"},{k:"ma"},{k:"pc"}],U,{id:"ius",onRow:1}));
    wireTable($("#tt"),rer,pickUC); }
  else if(t==="desuc"){ const rows=icmRows(); const des=[...new Set(rows.map(r=>r.designation))].map(d=>[d,rows.filter(r=>r.designation===d).length]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
    const m=new Map(); for(const r of rows){ const k=ucKey(r); const o=m.get(k)||m.set(k,{_k:k,total:0}).get(k); o[r.designation]=(o[r.designation]||0)+1; o.total++; }
    if(!S.sort.idu) S.sort.idu={k:"total",d:-1};
    tb.innerHTML=card("Designation-wise clusters by union council",`${esc(S.icm.camp)} · the ten designations with most clusters`,tableHTML([ucc,...des.map(d=>({k:d,t:d.length>26?d.slice(0,24)+"…":d})),{k:"total",t:"All"}],[...m.values()],{id:"idu",onRow:1})); wireTable($("#tt"),rer,pickUC); }
  else if(t==="ntc"||t==="tvc"){ const f=t==="ntc"?"nt":"tv", cs=D.icmCamps; const a=icmAgg(icmRows({camp:""}),r=>ucKey(r)+"#"+r.camp);
    const m=new Map(); for(const [k,v] of a){ const [u,c]=k.split("#"); const o=m.get(u)||m.set(u,{_k:u,total:0}).get(u); o[c]=v[f]; o.total+=v[f]; }
    const U=[...m.values()].filter(r=>r.total>0); const id="i"+f; if(!S.sort[id]) S.sort[id]={k:"total",d:-1};
    tb.innerHTML=card(t==="ntc"?"NT (no team visited) — comparative":"TVBMC (team visited, missed child) — comparative",`${esc(scopeName())} · every round`,tableHTML([ucc,...cs.map(c=>({k:c,t:shortCamp(c)})),{k:"total",t:"All rounds"}],U,{id,onRow:1})); wireTable($("#tt"),rer,pickUC); }
  else if(t==="missed"){ const U=[...icmAgg(icmRows(),ucKey)].map(([k,m])=>({_k:k,...m})).filter(r=>r.missed>0); if(!S.sort.imd) S.sort.imd={k:"missed",d:-1};
    tb.innerHTML=card("Missed children details",`${esc(S.icm.camp)} · where the missed children were found`,tableHTML([ucc,{k:"children"},{k:"missed"},{k:"nt"},{k:"tv"},{k:"na"},{k:"ref"},{k:"recallPct",bg:1}],U,{id:"imd",onRow:1})); wireTable($("#tt"),rer,pickUC); }
  else if(t==="day"){ const rows=icmRows({noDay:true}); const days=[...new Set(rows.map(r=>r.day))].sort((a,b)=>a-b);
    const m=new Map(); for(const r of rows){ const k=ucKey(r); const o=m.get(k)||m.set(k,{_k:k,total:0}).get(k); o["d"+r.day]=(o["d"+r.day]||0)+1; o.total++; }
    if(!S.sort.idy) S.sort.idy={k:"total",d:-1};
    tb.innerHTML=card("Clusters by campaign day",`${esc(S.icm.camp)} · how monitoring was spread across the days`,tableHTML([ucc,...days.map(d=>({k:"d"+d,t:"Day "+d})),{k:"total",t:"All days"}],[...m.values()],{id:"idy",onRow:1})); wireTable($("#tt"),rer,pickUC); }
}

/* =====================================================================
   COVERAGE vs ICM
   ===================================================================== */
const CMP_X=[{k:"hhcovPct",ref:.95},{k:"overallPct",ref:.95},{k:"sdc",ref:.395}], CMP_Y=[{k:"recallPct",ref:.9},{k:"seenPct",ref:.95}];
function axisSel(id,label,list,cur){ return `<div class="fld"><label for="${id}">${label}</label><select id="${id}">${list.map(x=>`<option value="${x.k}"${x.k===cur?" selected":""}>${esc(IND[x.k].t)}</option>`).join("")}</select></div>`; }
function pgCmp(el){
  const camp=S.cmp.camp, ic=D.icmByKey[campKey(camp)];
  const cov=covAgg(D.cov.filter(r=>r.camp===camp&&geoOK(r,true)),ucKey), icm=icmAgg(D.icm.filter(r=>r.camp===ic&&geoOK(r,true)),ucKey);
  const xr=CMP_X.find(x=>x.k===S.cmp.x), yr=CMP_Y.find(y=>y.k===S.cmp.y), XI=IND[xr.k], YI=IND[yr.k];
  const pts=[]; for(const [k,m] of cov){ const n=icm.get(k); if(!n) continue; const x=m[xr.k], y=n[yr.k]; if(x==null||y==null||!isFinite(x)||!isFinite(y)) continue; pts.push({_k:k,x,y,cl:n.clusters,m,n}); }
  const disc=pts.filter(p=>p.x>=xr.ref&&p.y<yr.ref).sort((a,b)=>a.y-b.y);
  const cT=one(covAgg(D.cov.filter(r=>r.camp===camp&&geoOK(r,true)))), iT=one(icmAgg(D.icm.filter(r=>r.camp===ic&&geoOK(r,true))));
  el.innerHTML=`${cmpHero(camp,ic,cT,iT,disc.length)}<div class="callout"><div>Admin-reported coverage from the coverage data set against what ICM monitors found <b>in the same union councils</b>. UCs in the red corner report high coverage but fail the monitoring standard — the first place to send a supervisor.</div></div>
  <div class="kband">${kpi(XI,cT?.[xr.k],null,null,XI.t+" (admin)")}${kpi(YI,iT?.[yr.k],null,null,YI.t+" (ICM)")}<div class="k"><span class="kn">UCs in both data sets</span><span class="kv">${nf.format(pts.length)}</span></div><div class="k"><span class="kn">Reported high, monitored low</span><span class="kv" style="color:${disc.length?"var(--fail)":"var(--pass)"}">${nf.format(disc.length)}</span><span class="ks">${pts.length?(disc.length/pts.length*100).toFixed(0)+"% of matched UCs":""}</span></div></div>
  <div class="card lift"><div class="card-h"><div><h3>Reported vs monitored</h3><p>${esc(scopeName())} · ${esc(camp)}</p></div></div><div class="gauges gx">${gauge2(cT?.[xr.k],XI,XI.t+" (admin)",{max:1.2})}${gauge2(iT?.[yr.k],YI,YI.t+" (ICM)",{max:1})}${xr.k==="overallPct"?gauge2(cT?.hhcovPct,IND.hhcovPct,"HH coverage (admin)",{max:1.2}):gauge2(cT?.overallPct,IND.overallPct,"Total coverage (admin)",{max:1.2})}${gauge2(iT?.seenPct,IND.seenPct,"Seen finger-marked (ICM)",{max:1})}</div></div>
  <div class="g-side">
    <div class="card lift"><div class="card-h"><div><h3>Each dot is a union council</h3><p>Dot size = clusters monitored</p></div>
      <div class="frow">${axisSel("cx","Across (admin)",CMP_X,xr.k)}${axisSel("cy","Up (ICM)",CMP_Y,yr.k)}</div></div>
      <div class="card-b chart" id="sc"></div></div>
    <div class="card"><div class="card-h"><div><h3>Reported high, monitored low</h3><p>${esc(XI.t)} ≥ ${fmt(xr.ref,{f:P})} but ${esc(YI.t)} &lt; ${fmt(yr.ref,{f:P,dp:0})}</p></div></div><div class="tw tall" id="dc">${tableHTML([{k:"_k",t:"Union council",l:1,fn:r=>ucLabel(r._k)},{k:"x",t:"Admin",ind:XI},{k:"y",t:"ICM",ind:YI},{k:"cl",t:"Clusters"}],disc,{onRow:1})}</div></div>
  </div>`;
  $("#cx").onchange=e=>{S.cmp.x=e.target.value;render();}; $("#cy").onchange=e=>{S.cmp.y=e.target.value;render();};
  wireTable($("#dc"),null,k=>{ S.icm.camp=ic; location.hash="#/icm/spot"; S.page="icm/spot"; pickUC(k); });
  const host=$("#sc"); if(!pts.length){ host.innerHTML='<div class="empty">No union council appears in both data sets for this campaign.</div>'; return; }
  const W=Math.max(300,host.clientWidth), H=Math.round(Math.min(480,Math.max(300,W*.66))), ml=48,mr=14,mt=12,mb=40, iw=W-ml-mr, ih=H-mt-mb;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y); const tx=niceTicks(Math.min(...xs,xr.ref)-.02,Math.max(...xs,xr.ref)+.02,5), ty=niceTicks(Math.min(...ys,yr.ref)-.02,Math.min(1,Math.max(...ys,yr.ref)+.01),5);
  const [xl,xh,yl,yh]=[tx[0],tx.at(-1),ty[0],ty.at(-1)], X=v=>ml+(v-xl)/(xh-xl)*iw, Y=v=>mt+ih-(v-yl)/(yh-yl)*ih, mc=Math.max(...pts.map(p=>p.cl))||1, R=c=>3.5+Math.sqrt(c/mc)*7;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Admin coverage against ICM per UC"><rect x="${X(xr.ref)}" y="${Y(yr.ref)}" width="${X(xh)-X(xr.ref)}" height="${Y(yl)-Y(yr.ref)}" fill="var(--fail-soft)"/>`;
  for(const t of tx) s+=`<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${mt}" y2="${mt+ih}"/><text x="${X(t)}" y="${H-mb+16}" text-anchor="middle">${Math.round(t*100)}%</text>`;
  for(const t of ty) s+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ml-7}" y="${Y(t)+4}" text-anchor="end">${Math.round(t*100)}%</text>`;
  s+=`<line class="ref" x1="${X(xr.ref)}" x2="${X(xr.ref)}" y1="${mt}" y2="${mt+ih}"/><line class="ref" x1="${ml}" x2="${W-mr}" y1="${Y(yr.ref)}" y2="${Y(yr.ref)}"/>`;
  s+=`<text x="${W-mr-6}" y="${Y(yl)-8}" text-anchor="end" style="fill:var(--fail);font-weight:700;letter-spacing:.06em;font-size:10.5px">REPORTED HIGH · MONITORED LOW</text><text x="${ml+iw/2}" y="${H-4}" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${esc(XI.t)} (admin) →</text><text transform="translate(12 ${mt+ih/2}) rotate(-90)" text-anchor="middle" style="fill:var(--ink-2);font-weight:600">${esc(YI.t)} (ICM) →</text>`;
  for(const p of [...pts].sort((a,b)=>b.cl-a.cl)){ const bad=p.x>=xr.ref&&p.y<yr.ref; s+=`<circle cx="${X(p.x)}" cy="${Y(Math.max(yl,p.y))}" r="${R(p.cl)}" fill="${bad?"var(--fail)":"var(--h3)"}" fill-opacity="${bad?.9:.42}" stroke="var(--surface)" stroke-width="1.4" data-k="${esc(p._k)}" style="cursor:pointer"/>`; }
  host.innerHTML=s+"</svg>";
  const svg=$("svg",host);
  svg.addEventListener("mousemove",e=>{ const c=e.target.closest("circle"); if(!c){hideTip();return;} const p=pts.find(q=>q._k===c.dataset.k); const [d,u]=p._k.split("|");
    showTip(e,`<h4>${esc(tc(u))}</h4><div class="w">${esc(tc(d))}</div>`+dlist([[XI.t+" (admin)",fmt(p.x,XI),1],[YI.t+" (ICM)",fmt(p.y,YI),1],["Clusters monitored",nf.format(p.cl)],["Still missed (admin)",fmt(p.m.still)],["Missed children (ICM)",fmt(p.n.missed)]])); });
  svg.addEventListener("mouseleave",hideTip);
  svg.addEventListener("click",e=>{ const c=e.target.closest("circle"); if(c){ S.icm.camp=ic; location.hash="#/icm/spot"; S.page="icm/spot"; pickUC(c.dataset.k); } });
}

/* =====================================================================
   FOOTER, ROUTER, BOOT
   ===================================================================== */
function footer(keys){ return `<div class="card" style="padding:12px 16px"><details class="defs"><summary>How these indicators are calculated</summary><div class="defs-g">${keys.map(k=>IND[k]).map(i=>`<div><b>${esc(i.t)}</b><br>${esc(i.d||"")}${i.band?` · <span style="color:var(--pass)">on target ${bandText(i).pass}</span>`:""}</div>`).join("")}</div></details></div>`; }
const RENDER={"cov/report":pgCovReport,"cov/maps":pgCovMaps,"cov/tables":pgCovTables,"cov/race":pgCovRace,"icm/dash":pgIcmDash,"icm/maps":pgIcmMaps,"icm/spot":pgIcmSpot,"icm/compare":pgIcmCompare,"icm/audit":pgIcmAudit,"icm/tables":pgIcmTables,"cmp":pgCmp};
function render(){
  cancelAnimationFrame(raceTimer); hideTip();
  $$(".nav a").forEach(a=>a.toggleAttribute("aria-current",false)); const a=$(`.nav a[data-p="${S.page}"]`); a&&a.setAttribute("aria-current","page");
  document.body.classList.remove("nav-open");
  killSat(); renderCtx(); const pg=$("#page"); pg.innerHTML="";
  try{ RENDER[S.page](pg); try{ afterRender(pg); }catch(e){ console.error(e); } }catch(err){ console.error(err); pg.innerHTML=`<div class="err"><b>This view could not be drawn.</b><br>${esc(err.message)}</div>`; }
  saveHash();
}
function saveHash(){ try{ const q=new URLSearchParams(); const g=S.geo; if(g.district)q.set("d",g.district); g.tehsils.forEach(t=>q.append("t",t)); g.ucs.forEach(u=>q.append("u",u));
  const P=PAGES[S.page]; if(P.ds==="cov")q.set("c",S.cov.camp); if(P.ds==="icm")q.set("c",S.icm.camp); if(P.ds==="cmp")q.set("c",S.cmp.camp);
  const h="#/"+S.page+(q.toString()?"?"+q:""); if(location.hash!==h) history.replaceState(null,"",h); }catch(e){} }
function readHash(){ const h=location.hash.slice(2); const [p,qs]=h.split("?"); if(RENDER[p]) S.page=p; const q=new URLSearchParams(qs||"");
  const d=q.get("d"); if(d&&D.H[d]){ S.geo.district=d; S.geo.tehsils=q.getAll("t").filter(t=>D.H[d][t]); const all=new Set(Object.values(D.H[d]).flatMap(s=>[...s])); S.geo.ucs=q.getAll("u").filter(u=>all.has(u)); }
  const c=q.get("c"), ds=PAGES[S.page].ds; if(c){ if(ds==="cov"&&D.covCamps.includes(c)) S.cov.camp=c; if(ds==="icm"&&D.icmCamps.includes(c)) S.icm.camp=c; if(ds==="cmp"&&D.cmpCamps.includes(c)) S.cmp.camp=c; } }
addEventListener("hashchange",()=>{ const p=location.hash.slice(2).split("?")[0]; if(RENDER[p]&&p!==S.page){ S.page=p; if(p==="cmp"){S.geo.tehsil="";S.geo.uc="";} render(); scrollTo({top:0}); } });
let rzT=0,lastW=innerWidth; addEventListener("resize",()=>{ if(Math.abs(innerWidth-lastW)<60) return; lastW=innerWidth; clearTimeout(rzT); rzT=setTimeout(()=>D&&render(),250); });
function railFoot(){ const f=t=>{ if(!t) return "—"; const d=new Date(t); return isNaN(d)?esc(t):d.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
  $("#rail-foot").innerHTML=`<span>Coverage data <b>${f(D.upd.cov)}</b></span><span>ICM data <b>${f(D.upd.icm)}</b></span><span class="rf-site"><b>Online Dashboard</b> — Peshawar Division, all districts · Campaign Coverages and Monitoring</span><span style="margin-top:4px">Summary figures only — no names or household details. Cluster GPS rounded to ~100 m.</span>`; }
load().then(()=>{ try{ $(".brand b").textContent=SITE.short; $(".brand small").textContent=SITE.place; document.title=SITE.name; }catch(e){} readHash(); railFoot(); render(); }).catch(err=>{ console.error(err);
  $("#page").innerHTML=`<div class="err"><b>The data files could not be loaded.</b><br>${esc(err.message)}<br><br>This page reads <code>data/coverage.csv</code>, <code>data/icm.csv</code> and <code>data/geo.json</code> from the same folder. Open it from the website address, not by double-clicking the file.</div>`; });
</script>
